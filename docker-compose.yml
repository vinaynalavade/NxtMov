version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./nxtmov.db
      - SECRET_KEY=dev_secret_key_nxtmov_2026
    volumes:
      - ./backend:/app
      - ./frontend:/app/frontend
    restart: unless-stopped
